[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hpc-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing SLURM, GPFS, Prometheus and Elasticsearch diagnostics for HPC support assistants"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "chavaga" }]
keywords = ["mcp", "hpc", "slurm", "gpfs", "prometheus", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Clustering",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp[cli]>=1.9,<2",
    "requests>=2.28",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hpc-mcp = "hpc_mcp.server:main"

[project.urls]
Homepage = "https://github.com/chavaga/hpc-mcp"
Issues = "https://github.com/chavaga/hpc-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hpc_mcp"]
